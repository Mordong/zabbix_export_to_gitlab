# Пример конфигурации для CLI-запуска (zabbix_template_sync.cli).
# Файл должен быть в UTF-8 (поддержка кириллицы).
# Скопируйте в config.yaml и заполните своими значениями.

zabbix:
  url: https://zabbix.example.com
  user: api-readonly
  password: "ВАШ_ПАРОЛЬ"
  verify_ssl: true
  # Базовый HTTP-таймаут к Zabbix API (сек) для обычных вызовов
  # (template.get, configuration.export и т.п.)
  timeout_sec: 60
  # Отдельный, более щедрый таймаут для auditlog.get bulk-запроса —
  # этот запрос на больших инсталляциях иногда занимает десятки секунд
  # при холодном кэше БД Zabbix.
  audit_timeout_sec: 180

gitlab:
  url: https://gitlab.example.com
  # Можно числовой ID или URL-encoded путь "group%2Fsubgroup%2Fproject"
  project_id: "monitoring/zabbix-templates"
  # Personal Access Token / Project Access Token / Group Access Token
  # с правами api + write_repository
  token: "glpat-XXXXXXXXXXXXXXXXXXXX"
  branch: main
  verify_ssl: true

sync:
  # Поддиректория в репозитории, куда складывать шаблоны.
  # Пустая строка "" = в корень репо (используйте, если репозиторий
  # сам по себе называется templates и предназначен только для шаблонов).
  templates_subdir: templates

  # Сколько секунд должно пройти с момента последнего изменения шаблона
  # в Zabbix, прежде чем закоммитить его обновление в GitLab.
  # 3600 = 1 час (требование ТЗ).
  quiet_period_sec: 3600

  # Окно audit log запроса = quiet_period_sec + audit_window_padding_sec.
  # Запас на пропущенный запуск DAG; рекомендуется один schedule_interval.
  # Больше значение → больше данных читает Zabbix → выше риск таймаута.
  audit_window_padding_sec: 900

  # Верхняя граница записей в одном auditlog.get запросе.
  # Защита от того, что в окне внезапно окажется аномально много записей.
  audit_query_limit: 5000

  # Опциональные фильтры (закомментируйте, чтобы синхронизировать ВСЕ шаблоны).
  # template_groups:
  #   - Templates/Operating systems
  #   - Шаблоны/СУБД
  # template_hosts:
  #   - Linux by Zabbix agent
  #   - Windows by Zabbix agent

  # true  — все изменения в один атомарный коммит (рекомендуется);
  # false — отдельный коммит на каждый файл (более «болтливая» история).
  single_commit: true

  commit_author_name: "Zabbix Sync Bot"
  commit_author_email: "zabbix-sync@example.com"
